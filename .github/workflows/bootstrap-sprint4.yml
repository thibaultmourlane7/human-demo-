name: Bootstrap HUMAN Sprint 4 public source

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-sprint4.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct Sprint 4 source
        run: |
          cat .bootstrap/part-*.b64 | tr -d '\n' | base64 -d > /tmp/human-demo.tar.gz
          mkdir -p /tmp/human-demo-source
          tar -xzf /tmp/human-demo.tar.gz -C /tmp/human-demo-source
          rsync -a --delete --exclude '.git/' /tmp/human-demo-source/human-demo/ ./
      - name: Commit extracted source
        run: |
          git config user.name "HUMAN Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sprint 4: live accounts and expert workspace" || exit 0
          git push origin main
