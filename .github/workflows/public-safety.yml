name: Public safety and build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:public
      - run: node scripts/check-building-finance.mjs
      - run: node scripts/check-building-attachments.mjs
      - run: npm run build
      - name: Android Capacitor project generation smoke test
        if: github.ref == 'refs/heads/feature/s12-mobile'
        run: |
          npx cap add android
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/settings.gradle
