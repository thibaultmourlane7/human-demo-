name: Public safety and build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      # Temporary lockfile transport for a one-off verified GitHub commit.
      - name: Export dependency lockfile
        if: github.ref == 'refs/heads/feature/s12-mobile'
        run: |
          echo HUMAN_LOCKFILE_BEGIN
          base64 -w0 package-lock.json
          echo
          echo HUMAN_LOCKFILE_END
      - run: npm run check:public
      - run: node scripts/check-building-attachments.mjs
      - run: npm run build
